<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pick List</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
    body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    .hdr{position:relative;background:#1a1a1a;border-bottom:2px solid #00c853;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .hdr-left{display:flex;flex-direction:column;gap:2px;}
    .hdr-title{font-size:16px;font-weight:700;}
    .hdr-sub{font-size:11px;color:#555;}
    .filler-row{background:#161616;border-bottom:1px solid #222;padding:8px 12px;display:flex;gap:7px;flex-shrink:0;}
    .filler-btn{flex:1;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:700;border:1.5px solid #2a2a2a;color:#555;cursor:pointer;touch-action:manipulation;transition:all .15s;text-align:center;}
    .filler-btn.active{border-color:#00c853;color:#00c853;background:rgba(0,200,83,.08);}
    .prog-track{height:4px;background:#1e1e1e;flex-shrink:0;}
    .prog-fill{height:100%;background:#00c853;transition:width .35s ease;}
    .tabs{background:#0f0f0f;border-bottom:1px solid #1a1a1a;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;padding:6px 12px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid #222;color:#444;cursor:pointer;touch-action:manipulation;transition:all .15s;white-space:nowrap;}
    .tab.cur{border-color:#00c853;color:#00c853;background:rgba(0,200,83,.07);}
    .tab.done{border-color:#1a1a1a;color:#2a2a2a;text-decoration:line-through;}
    .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 18px 8px;overflow:hidden;}
    .loc-name{font-size:12px;color:#555;text-align:center;margin-bottom:3px;}
    .count{font-size:11px;color:#333;margin-bottom:14px;}
    .card{width:100%;max-width:340px;background:#1a1a1a;border:2px solid #00c853;border-radius:18px;padding:24px 20px;text-align:center;margin-bottom:16px;box-shadow:0 0 30px rgba(0,200,83,.06);}
    .card-lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:7px;}
    .card-name{font-size:30px;font-weight:800;color:#fff;margin-bottom:14px;line-height:1.2;}
    .qty-row{display:flex;align-items:center;justify-content:center;gap:10px;}
    .qty-lbl{font-size:12px;color:#555;}
    .qty-val{font-size:56px;font-weight:900;color:#00c853;line-height:1;text-shadow:0 0 18px rgba(0,200,83,.3);}
    .fb{font-size:13px;color:#333;min-height:20px;margin-bottom:12px;text-align:center;transition:color .15s;}
    .fb.ok{color:#00c853;}.fb.err{color:#ff6b6b;}
    .btn-row{display:flex;gap:12px;width:100%;max-width:340px;}
    .btn-pick{flex:3;padding:32px 22px;background:#00c853;color:#000;font-size:24px;font-weight:900;border:none;border-radius:16px;cursor:pointer;touch-action:manipulation;min-height:90px;}
    .btn-pick:active{background:#00a843;transform:scale(0.98);}
    .btn-skip{flex:1;padding:32px 12px;background:#1e1e1e;color:#888;font-size:15px;font-weight:700;border:1.5px solid #333;border-radius:16px;cursor:pointer;touch-action:manipulation;min-height:90px;}
    .btn-skip:active{background:#2a2a2a;}
    .btn-mic{width:100%;max-width:340px;padding:13px;background:transparent;color:#444;font-size:13px;font-weight:600;border:1px solid #222;border-radius:12px;cursor:pointer;touch-action:manipulation;margin-top:10px;}
    .btn-mic:active{background:#1a1a1a;}
    .net-pill{position:fixed;top:8px;right:8px;padding:5px 10px;border-radius:12px;font-size:10px;font-weight:700;z-index:1000;display:none;}
    .net-pill.offline{display:block;background:#3a1010;color:#ff6b6b;border:1px solid #ff6b6b;}
    .net-pill.online{display:block;background:#0a2a14;color:#00c853;border:1px solid #00c853;animation:fadeOut 2s forwards;animation-delay:1.5s;}
    @keyframes fadeOut{to{opacity:0;display:none;}}
    .done-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;gap:14px;}
    .done-icon{font-size:60px;}
    .done-title{font-size:24px;font-weight:800;color:#00c853;}
    .done-sub{font-size:14px;color:#666;line-height:1.6;}
    .skip-box{background:#1a1a1a;border:1px solid #1e1e1e;border-radius:12px;padding:14px 18px;width:100%;max-width:320px;text-align:left;max-height:180px;overflow-y:auto;}
    .skip-hdr{font-size:11px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .skip-row{font-size:12px;color:#666;padding:4px 0;border-bottom:1px solid #1a1a1a;}
    .skip-row:last-child{border:none;}
    .btn-restart{background:#1a1a1a;border:1.5px solid #222;color:#888;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;}
  </style>
</head>
<body>
<div id="netPill" class="net-pill"></div>
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">🏪 Pick List <span id="hdrDate"></span></div>
    <div class="hdr-sub" id="hdrSub">Select a filler to start</div>
  </div>
</div>
<div class="filler-row" id="fillerRow"></div>
<div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
<div class="tabs" id="tabs"></div>
<div id="screenPick" class="body" style="display:none">
  <div class="loc-name" id="locName"></div>
  <div class="count" id="countTxt"></div>
  <div class="card">
    <div class="card-lbl">Pick</div>
    <div class="card-name" id="itemName">—</div>
    <div class="qty-row"><div class="qty-lbl">Qty</div><div class="qty-val" id="itemQty">0</div></div>
  </div>
  <div class="fb" id="fb"></div>
  <div class="btn-row">
    <button class="btn-pick" onclick="confirmPick()">✓ PICKED</button>
    <button class="btn-skip" onclick="skipItem()">SKIP</button>
  </div>
  <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤 Start Voice</button>
</div>
<div id="screenDone" style="display:none;flex:1;">
  <div class="done-body">
    <div class="done-icon">✅</div>
    <div class="done-title" id="doneTitle">Done!</div>
    <div class="done-sub" id="doneSub"></div>
    <div class="skip-box" id="skipBox" style="display:none">
      <div class="skip-hdr">Skipped Items</div>
      <div id="skipList"></div>
    </div>
    <button class="btn-restart" onclick="restart()">↩ Back to Fillers</button>
  </div>
</div>

let currentFiller=null,route=[],machineIdx=0,itemIdx=0,skipped=[],totalItems=0,pickedCount=0;
let isListening=false,recognition=null,ttsActive=false;

function selectFiller(name){
  currentFiller=name;
  route=ROUTES[name];
  machineIdx=0;itemIdx=0;skipped=[];pickedCount=0;
  totalItems=route.reduce((s,m)=>s+m.items.length,0);
  document.querySelectorAll('.filler-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.filler===name);
  });
  document.getElementById('hdrSub').textContent=name+' • '+route.length+' machines • '+totalItems+' items';
  document.getElementById('screenPick').style.display='flex';
  document.getElementById('screenDone').style.display='none';
  renderTabs();render();
}

function renderTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  route.forEach((m,i)=>{
    const t=document.createElement('div');
    t.className='tab'+(i===machineIdx?' cur':'')+(i<machineIdx?' done':'');
    t.textContent='T'+m.trip+' • '+m.loc;
    t.onclick=()=>jumpMachine(i);
    tabs.appendChild(t);
  });
}

function jumpMachine(i){
  machineIdx=i;itemIdx=0;
  renderTabs();render();
}

function render(){
  if(machineIdx>=route.length){finish();return;}
  const m=route[machineIdx];
  if(itemIdx>=m.items.length){
    machineIdx++;itemIdx=0;
    renderTabs();render();return;
  }
  const it=m.items[itemIdx];
  document.getElementById('locName').textContent=m.loc+' (Trip '+m.trip+')';
  document.getElementById('countTxt').textContent='Item '+(itemIdx+1)+' of '+m.items.length;
  document.getElementById('itemName').textContent=it.n;
  document.getElementById('itemQty').textContent=it.q;
  const prog=(pickedCount+skipped.length)/totalItems*100;
  document.getElementById('progFill').style.width=prog+'%';
  if(isListening) speakAndPause('Pick '+it.q+' '+it.n);
}

function confirmPick(){
  pickedCount++;
  setFb('Picked ✓','ok');
  itemIdx++;
  setTimeout(render,150);
}

function skipItem(){
  const m=route[machineIdx];const it=m.items[itemIdx];
  skipped.push(it.n+' x'+it.q+' @ '+m.loc);
  setFb('Skipped','err');
  itemIdx++;
  setTimeout(render,150);
}

function setFb(t,c){
  const f=document.getElementById('fb');
  f.textContent=t;f.className='fb '+(c||'');
  setTimeout(()=>{f.textContent='';f.className='fb';},900);
}

function finish(){
  document.getElementById('screenPick').style.display='none';
  document.getElementById('screenDone').style.display='flex';
  document.getElementById('doneTitle').textContent='Done, '+currentFiller+'!';
  document.getElementById('doneSub').textContent=pickedCount+' picked'+(skipped.length?' • '+skipped.length+' skipped':'');
  if(skipped.length){
    document.getElementById('skipBox').style.display='block';
    document.getElementById('skipList').innerHTML=skipped.map(s=>'<div class="skip-row">'+s+'</div>').join('');
  }
  stopMic();
}

function restart(){
  currentFiller=null;route=[];machineIdx=0;itemIdx=0;skipped=[];pickedCount=0;
  document.querySelectorAll('.filler-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('hdrSub').textContent='Select a filler to start';
  document.getElementById('progFill').style.width='0%';
  document.getElementById('tabs').innerHTML='';
  document.getElementById('screenPick').style.display='none';
  document.getElementById('screenDone').style.display='none';
  document.getElementById('skipBox').style.display='none';
  stopMic();
}

function toggleMic(){
  if(isListening){stopMic();}else{startMic();}
}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setFb('Voice not supported','err');return;}
  isListening=true;
  requestWakeLock();
  spawnRecognition();
  document.getElementById('micBtn').textContent='🎤 Voice On';
  document.getElementById('micBtn').style.color='#00c853';
  document.getElementById('micBtn').style.borderColor='#00c853';
  render();
}

function spawnRecognition(){
  if(!isListening) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{
    if(recognition){try{recognition.abort();}catch(e){}}
    recognition=new SR();
    recognition.continuous=true;
    recognition.interimResults=false;
    recognition.lang='en-AU';
    recognition.onresult=(e)=>{
      if(ttsActive) return; // ignore results captured during TTS
      const cmd=e.results[e.results.length-1][0].transcript.toLowerCase().trim();
      handleCmd(cmd);
    };
    recognition.onerror=(e)=>{
      if(e.error==='no-speech') return;
      if(e.error==='network'){
        showNet(false);
        // try again in 3s
        setTimeout(()=>{if(isListening)spawnRecognition();},3000);
        return;
      }
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        setFb('Mic permission denied','err');
        stopMic();
        return;
      }
      // any other error - just respawn
    };
    recognition.onend=()=>{
      if(!isListening) return;
      if(ttsActive){
        // recognition ended because TTS started; will be respawned by TTS handler
        return;
      }
      // small delay avoids InvalidStateError race
      setTimeout(()=>{if(isListening&&!ttsActive)spawnRecognition();},250);
    };
    recognition.start();
  }catch(err){
    // start() can throw if previous instance still alive
    setTimeout(()=>{if(isListening)spawnRecognition();},500);
  }
}

function stopMic(){
  isListening=false;
  if(recognition){try{recognition.abort();}catch(e){}recognition=null;}
  window.speechSynthesis&&window.speechSynthesis.cancel();
  ttsActive=false;
  releaseWakeLock();
  const b=document.getElementById('micBtn');
  if(b){b.textContent='🎤 Start Voice';b.style.color='';b.style.borderColor='';}
}

function handleCmd(cmd){
  if(!currentFiller)return;
  if(cmd.includes('pick')||cmd.includes('got it')||cmd.includes('yes')||cmd.includes('done')||cmd.includes('next')){
    confirmPick();
  }else if(cmd.includes('skip')){
    skipItem();
  }
}

// Pause mic while TTS speaks, resume after - they fight on Android
function speakAndPause(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  ttsActive=true;
  // stop mic so it doesn't capture our own voice
  if(recognition){try{recognition.abort();}catch(e){}}
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.95;u.pitch=1;
  u.onend=()=>{
    ttsActive=false;
    // small gap then resume listening
    setTimeout(()=>{if(isListening)spawnRecognition();},150);
  };
  u.onerror=()=>{
    ttsActive=false;
    setTimeout(()=>{if(isListening)spawnRecognition();},150);
  };
  window.speechSynthesis.speak(u);
}

function speak(text){
  // kept for compatibility - just routes through speakAndPause
  speakAndPause(text);
}

// ---- WAKE LOCK: keep screen on during shift ----
let wakeLock=null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null;});
    }
  }catch(e){/* ignore - device may not support */}
}
function releaseWakeLock(){
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
}
// Re-acquire wake lock if page becomes visible again (Android releases it on background)
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && isListening){
    requestWakeLock();
    // also respawn recognition - Android often kills it when backgrounded
    if(!ttsActive) setTimeout(spawnRecognition,300);
  }
});

// ---- NETWORK STATUS ----
function showNet(online){
  const p=document.getElementById('netPill');
  if(online){
    p.className='net-pill online';
    p.textContent='● Online';
  }else{
    p.className='net-pill offline';
    p.textContent='⚠ Offline - voice may fail';
  }
}
window.addEventListener('offline',()=>showNet(false));
window.addEventListener('online',()=>{
  showNet(true);
  if(isListening) setTimeout(spawnRecognition,500);
});
// Check initial state
if(!navigator.onLine) showNet(false);

</script>

<script>
// ---- Paste-loader: parse picklist text into ROUTES, save to localStorage ----
// Product list is NOT hardcoded — we infer products structurally by finding the
// longest common location-prefix across all records in each trip. That way a new
// SKU appearing in the source data is picked up automatically instead of being
// silently dropped at parse time.
function _parsePicklist(text){
  text = text.replace(/\s+/g, ' ').replace(/Line ID Filler Name[\s\S]*?Picked/g, ' ').replace(/\s+/g, ' ').trim();
  const _DATE = '(?:\\d{4}-\\d-\\d{1,2}|\\d{2}\\/\\d{2}\\/\\d{4})';
  const _NAME = "[A-Z][A-Za-z'\u2019\\-]*(?:\\s+[A-Z][A-Za-z'\u2019\\-]*){0,2}";
  const fillerRe = new RegExp(`\\b1\\s+(${_NAME})\\s+\\d{1,2}\\s+${_DATE}`, 'g');
  const fillerSet = new Set();
  let mm; while ((mm = fillerRe.exec(text))) fillerSet.add(mm[1]);
  if (!fillerSet.size) {
    const hasSummaryKeywords = /\b(Chips|Confec|Bottles|Cans|Meals)\s/.test(text);
    if (hasSummaryKeywords) throw new Error('You pasted the summary pages (product totals). The app needs the detail pages with rows like "1 Dadir 1 ... RR chilli 3". Scroll past the summary in the PDF and try again.');
    throw new Error('No filler/date patterns found. Expected rows like "1 Dadir 1 2026-5-28 131183 12 L U Simon RR chilli 3". First 80 chars of paste: ' + text.slice(0, 80));
  }
  const _esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const fillerAlt = [...fillerSet].sort((a,b)=>b.length-a.length).map(_esc).join('|');
  const recRe = new RegExp(`(?=\\b1\\s+(?:${fillerAlt})\\s+\\d{1,2}\\s+${_DATE})`, 'g');
  const recParse = new RegExp(`^1\\s+(${fillerAlt})\\s+(\\d{1,2})\\s+${_DATE}\\s+(\\S+)\\s+(.+?)\\s+(\\d+)\\s*$`);
  const chunks = (' ' + text).split(recRe);

  // Phase 1: extract raw rows by trip
  const rawRows = {}; // filler -> trip -> [{locId, middle, qty}]
  let parsed = 0, failed = 0;
  for (let chunk of chunks){
    chunk = chunk.trim(); if (!chunk) continue;
    const m = chunk.match(recParse);
    if (!m){ failed++; continue; }
    const [, filler, tripStr, locId, middle, qtyStr] = m;
    const trip = +tripStr, qty = +qtyStr;
    if (!rawRows[filler]) rawRows[filler] = {};
    if (!rawRows[filler][trip]) rawRows[filler][trip] = [];
    rawRows[filler][trip].push({locId, middle, qty});
  }

  // Token-level longest common prefix; reject unless it begins with a 2-digit token
  // (locName always starts with a zero-padded 2-digit number).
  function _tokenLCP(middles){
    if (middles.length < 2) return null;
    const tokenized = middles.map(m => m.split(' '));
    const minLen = Math.min(...tokenized.map(t => t.length));
    const pre = [];
    for (let i = 0; i < minLen; i++){
      const first = tokenized[0][i];
      if (tokenized.every(t => t[i] === first)) pre.push(first); else break;
    }
    if (!pre.length || !/^\d{2}$/.test(pre[0])) return null;
    return pre.join(' ');
  }

  // Phase 2: per-trip LCP → location; collect discovered products as fallback
  const discovered = new Set();
  const tripPrefix = {};
  for (const f of Object.keys(rawRows)){
    for (const t of Object.keys(rawRows[f])){
      const prefix = _tokenLCP(rawRows[f][t].map(r => r.middle));
      tripPrefix[f + '/' + t] = prefix;
      if (prefix !== null){
        for (const r of rawRows[f][t]){
          const p = r.middle.slice(prefix.length).trim();
          if (p) discovered.add(p);
        }
      }
    }
  }
  const discSorted = [...discovered].sort((a,b) => b.length - a.length);

  // Phase 3: build final routes (with fallback for single-record trips)
  const out = {};
  for (const f of Object.keys(rawRows)){
    for (const t of Object.keys(rawRows[f])){
      const trip = +t;
      const recs = rawRows[f][t];
      const prefix = tripPrefix[f + '/' + t];
      let loc = null;
      const items = [];
      for (const r of recs){
        let product = null;
        if (prefix !== null){
          product = r.middle.slice(prefix.length).trim();
        } else {
          // single-record trip: try discovered products as longest suffix
          for (const p of discSorted){
            if (r.middle === p || r.middle.endsWith(' ' + p)){ product = p; break; }
          }
          // last-resort: take the last token (will sort to end as a canary)
          if (!product){ const toks = r.middle.split(' '); product = toks[toks.length-1]; }
        }
        if (!product){ failed++; continue; }
        if (!loc){
          const locName = (prefix !== null) ? prefix : r.middle.slice(0, r.middle.length - product.length).trim();
          loc = (r.locId + ' ' + locName).trim();
        }
        items.push({n: product, q: r.qty});
        parsed++;
      }
      if (!out[f]) out[f] = {};
      out[f][trip] = {trip, loc, items};
    }
  }
  const result = {};
  for (const f of Object.keys(out)){
    result[f] = Object.keys(out[f]).map(k=>+k).sort((a,b)=>a-b).map(t=>out[f][t]);
  }
  return {routes: result, parsed, failed};
}

// ---- PDF upload: lazy-load PDF.js on first use, extract text, feed to parser ----
let _pdfjsReady = null;
function _loadPdfJs(){
  if (_pdfjsReady) return _pdfjsReady;
  _pdfjsReady = new Promise((resolve, reject) => {
    if (window['pdfjs-dist/build/pdf']) { resolve(window['pdfjs-dist/build/pdf']); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      const lib = window['pdfjs-dist/build/pdf'];
      lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(lib);
    };
    s.onerror = () => reject(new Error('Could not load PDF library. Check your internet connection.'));
    document.head.appendChild(s);
  });
  return _pdfjsReady;
}

async function loadPdf(file){
  const stat = document.getElementById('pdfStat');
  if (!file){ stat.textContent='No file selected.'; stat.className='pdf-stat err'; return; }
  stat.textContent = 'Loading PDF library...';
  stat.className = 'pdf-stat';
  try {
    const pdfjsLib = await _loadPdfJs();
    stat.textContent = 'Reading PDF...';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    let text = '';
    for (let p = 1; p <= pdf.numPages; p++){
      stat.textContent = 'Reading page ' + p + ' of ' + pdf.numPages + '...';
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      text += ' ' + content.items.map(it => it.str).join(' ');
    }
    stat.textContent = 'Parsing ' + Math.round(text.length/1024) + 'KB of text...';
    const {routes, parsed, failed} = _parsePicklist(text);
    const fillers = Object.keys(routes);
    if (!fillers.length) throw new Error('PDF read but no pick records found inside it. Wrong PDF?');
    localStorage.setItem('picklistRoutes', JSON.stringify(routes));
    localStorage.setItem('picklistLoadedAt', new Date().toISOString());
    stat.textContent = 'Loaded ' + parsed + ' picks across ' + fillers.length + ' fillers (' + fillers.join(', ') + '). Reloading...';
    stat.className = 'pdf-stat ok';
    setTimeout(()=>location.reload(), 900);
  } catch (e){
    stat.textContent = 'Failed: ' + e.message;
    stat.className = 'pdf-stat err';
    // reset file input so the same file can be retried after a fix
    document.getElementById('pdfFile').value = '';
  }
}

function openLoader(){ document.getElementById('loader').classList.add('show'); }
function closeLoader(){ document.getElementById('loader').classList.remove('show'); document.getElementById('loaderStat').textContent=''; }
function loaderParse(){
  const txt = document.getElementById('loaderText').value;
  const stat = document.getElementById('loaderStat');
  if (!txt.trim()){ stat.textContent='Paste text first.'; stat.className='stat err'; return; }
  try {
    const {routes, parsed, failed} = _parsePicklist(txt);
    const fillers = Object.keys(routes);
    if (!fillers.length) throw new Error('No records parsed.');
    localStorage.setItem('picklistRoutes', JSON.stringify(routes));
    localStorage.setItem('picklistLoadedAt', new Date().toISOString());
    stat.textContent = `Loaded: ${parsed} picks across ${fillers.length} fillers (${fillers.join(', ')}). ${failed?failed+' lines skipped.':''} Reloading...`;
    stat.className = 'stat ok';
    setTimeout(()=>location.reload(), 800);
  } catch(e){
    stat.textContent = 'Parse failed: ' + e.message;
    stat.className = 'stat err';
  }
}
function loaderReset(){
  if (!confirm('Clear loaded data and use built-in routes?')) return;
  localStorage.removeItem('picklistRoutes');
  localStorage.removeItem('picklistLoadedAt');
  location.reload();
}

// ---- Boot: override ROUTES from localStorage if present, build buttons ----
// ============================================================================
// WAREHOUSE WALK ORDER — pick-sort spec.  *** VERIFY LAYOUT AS OF: 2026-09-16 ***
// If the warehouse is rearranged or a new product appears, update WALK_ORDER.
// Names are lowercased data tokens; case variants collapse automatically.
// ============================================================================
const WALK_ORDER = [
  // 1. DRINKS WALL (left -> right)
  "coke zero","pepsi max","sunkist zero sugar","sunkist","solo","solo zero sugar",
  "lemonade","creaming soda","pasito","coconut water","mother sugar free",
  "v blue","v energy","v energy sugar free","red bull","red bull sugar free","v blue zero sugar",
  "powerade","gatorade","gatorade no sugar","gatorade sugar free",
  "aloe vera drink","aloe vera drink 2","water","lipton peach iced tea","sparkling water",
  // 2. CHOCOLATES
  "aitken bar","kit kat","dairy","twix","boost","wagon wheels","snickers","mars bar",
  "aero mint","muesli","carmans protein new","tuna treats","up &go pro","extra gum",
  "tuna pasta","apricot yoghurt","choc oat",
  // 3. COOKIES
  "salted caramel","choc chip","white choc m",
  // 4. LOLLIES
  "mix lollies",
  // 5. NOODLES (second-to-last: bulky, goes on top so it isn't crushed)
  "noodles",
  // 6. CHIPS (last: bulky)
  "rr chilli","rr honey","smith sv","smith ck","shapes bbq"
];
// Spelling-variant aliases. Keys/values matched after _norm (case + spacing + punct insensitive).
const ALIASES = {
  "carmens protein new": "carmans protein new",
  "indulge bar":         "aitken bar",   // spec: Aitken Bar = Indulge Bar = Atkins
  "atkins":              "aitken bar",   //   "
  "mixed lollies":       "mix lollies",  // source-data drift, same product
  "v blue zore sugar":   "v blue zero sugar" // typo variant in source data
};
// PERMANENT removals — structural business rules, survive restocks. Exact match (after _norm).
const PERMANENT_REMOVE = ["coke"];                 // regular Coke = slabs (Coke Zero is NOT removed)
// TEMPORARY removals — EDIT THESE as stock changes. Re-check regularly.
const TEMP_REMOVE = ["obento noodles","vimto","mymusclechef mix"]; // out of stock / no-pick

// _norm strips spaces + punctuation so source-data drift (extra space around "&", a dash that
// appears in "MyMuscleChef - Mix", capitalisation) doesn't cause silent miss-sort or miss-remove.
const _norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const _WALK_LOOKUP = {}; WALK_ORDER.forEach((n,i) => _WALK_LOOKUP[_norm(n)] = i);
const _ALIASES_N = {};
for (const k of Object.keys(ALIASES)) _ALIASES_N[_norm(k)] = _norm(ALIASES[k]);
const _PERM_N = PERMANENT_REMOVE.map(_norm);
const _TEMP_N = TEMP_REMOVE.map(_norm);
function _walkIndex(name){ let k=_norm(name); if(_ALIASES_N[k]) k=_ALIASES_N[k]; const i=_WALK_LOOKUP[k]; return i===undefined?9999:i; }
function _isRemoved(name){ const k=_norm(name); return _PERM_N.includes(k)||_TEMP_N.includes(k); }
// Sort + filter every trip's items by walk order (idempotent; safe to run repeatedly)
function applyWalkOrder(routes){
  Object.keys(routes).forEach(f=>{
    routes[f].forEach(trip=>{
      trip.items = trip.items
        .filter(it => !_isRemoved(it.n))
        .sort((a,b) => _walkIndex(a.n) - _walkIndex(b.n));
    });
  });
  return routes;
}

(function boot(){
  try {
    const saved = localStorage.getItem('picklistRoutes');
    if (saved){
      const parsed = JSON.parse(saved);
      // Replace built-in ROUTES contents in-place
      Object.keys(ROUTES).forEach(k=>delete ROUTES[k]);
      Object.assign(ROUTES, parsed);
    }
  } catch(e){ console.warn('Bad saved routes', e); }
  // Sort + filter all picks into warehouse walking order (built-in or loaded data alike)
  applyWalkOrder(ROUTES);
  // Build filler buttons
  const row = document.getElementById('fillerRow');
  const names = Object.keys(ROUTES);
  row.innerHTML = '';
  names.forEach(name=>{
    const b = document.createElement('div');
    b.className = 'filler-btn';
    b.dataset.filler = name;
    b.textContent = '👤 ' + name;
    b.onclick = ()=>selectFiller(name);
    row.appendChild(b);
  });
  // Show load date in header
  const loadedAt = localStorage.getItem('picklistLoadedAt');
  const d = document.getElementById('hdrDate');
  if (d){
    if (loadedAt){
      const dt = new Date(loadedAt);
      d.textContent = '— ' + dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    } else {
      d.textContent = '— 28 May';
    }
  }
})();
